<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLWS｜调温而行</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- 导航栏容器 -->
        <div id="navbar-container"></div>

        <!-- 主要内容区 -->
        <main class="main-content">
            <div class="articles-layout">
                <!-- 左侧文章列表 -->
                <div class="articles-main">
                    <div class="articles-container" id="articles-container">
                        <!-- 文章列表将通过 JavaScript 动态加载 -->
                    </div>
                    
                    <!-- 分页控件 -->
                    <div class="pagination" id="pagination">
                        <!-- 分页按钮将通过 JavaScript 动态加载 -->
                    </div>
                </div>

                <!-- 右侧搜索和标签 -->
                <div class="articles-sidebar">
                    <!-- 搜索框 -->
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-box" id="search-box" placeholder="搜索文章...">
                    </div>

                    <!-- 标签云 -->
                    <div class="tag-cloud" id="tag-cloud">
                        <!-- 标签将通过 JavaScript 动态加载 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- 页脚容器 -->
        <div id="footer-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
