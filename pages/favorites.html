<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏 - QLWS｜调温而行</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- 导航栏容器 -->
        <div id="navbar-container"></div>

        <!-- 主要内容区 -->
        <main class="main-content">
            <h1 class="page-title"><i class="fas fa-bookmark"></i> 收藏</h1>
            
            <!-- 搜索框 -->
            <div class="favorites-search">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="favorites-search-input" class="search-box" placeholder="搜索收藏...">
                    <div class="search-engines">
                        <button id="baidu-search-btn" class="search-engine-btn active" title="百度搜索" data-engine="baidu">
                            <i class="fas fa-bold"></i>
                        </button>
                        <button id="bing-search-btn" class="search-engine-btn" title="必应搜索" data-engine="bing">
                            <i class="fab fa-microsoft"></i>
                        </button>
                        <button id="google-search-btn" class="search-engine-btn" title="谷歌搜索" data-engine="google">
                            <i class="fab fa-google"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="favorites-container">
                <!-- 分类导航 -->
                <div class="categories-nav">
                    <h3><i class="fas fa-list"></i> 分类导航</h3>
                    <ul class="category-list" id="category-list">
                        <!-- 分类列表将通过 JavaScript 动态加载 -->
                    </ul>
                </div>
                
                <!-- 收藏内容 -->
                <div class="favorites-content" id="favorites-content">
                    <!-- 收藏内容将通过 JavaScript 动态加载 -->
                </div>
            </div>
        </main>

        <!-- 页脚容器 -->
        <div id="footer-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/favorites.js"></script>
</body>
</html>
