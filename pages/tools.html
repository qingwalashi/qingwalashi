<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具 - QLWS｜调温而行</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- 导航栏容器 -->
        <div id="navbar-container"></div>

        <!-- 主要内容区 -->
        <main class="main-content">
            <h1 class="page-title"><i class="fas fa-tools"></i> 工具</h1>
            <div class="tools-container" id="tools-container">
                <!-- 工具列表将通过 JavaScript 动态加载 -->
            </div>
        </main>

        <!-- 页脚容器 -->
        <div id="footer-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        // 加载工具文章
        async function loadTools() {
            try {
                const response = await fetch('../blog-index.yaml');
                const text = await response.text();
                const articles = jsyaml.load(text).articles;
                
                // 筛选带有"工具"标签的文章
                const tools = articles.filter(article => 
                    article.tags.some(tag => tag === "工具")
                );

                const container = document.getElementById('tools-container');
                
                if (tools.length === 0) {
                    container.innerHTML = `
                        <div class="no-tools">
                            暂无工具文章
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tools.map(tool => {
                    // 处理路径
                    const href = tool.type === 'link' ? tool.url : '../' + tool.path;
                    
                    // 添加 GitHub 图标（如果有 repo 链接）
                    const githubIcon = tool.repo ? `
                        <a href="${tool.repo}" class="tool-github" target="_blank" title="查看源码">
                            <i class="fab fa-github"></i>
                        </a>
                    ` : '';
                    
                    return `
                        <div class="tool-card">
                            <div>
                                <h2 class="tool-title">${tool.title}</h2>
                                ${githubIcon}
                                <p class="tool-description">${tool.description}</p>
                            </div>
                            <a href="${href}" class="tool-link" target="_blank">
                                使用工具 <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading tools:', error);
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadTools);
    </script>
</body>
</html>
