          text: "# 采购内容分类\n\n作为资深采购专员，你将提取采购文件{{#1744807216944.content#}}的采购内容，识别并总结采购内容里的硬件采购部分（hardware_purchase）、成品软件采购部分（software_purchase）、定制化系统采购部分（custom_system_development）\n\
            \n## 特殊说明\n1.回答结果不需要假设，内容均来自我提供的数据\n2.如果原文不包含硬件采购部分（hardware_purchase）、成品软件采购部分（software_purchase）、定制化系统采购部分（custom_system_development）的其中一个或几个部分，则对应的\
            \ json 字段返回“不涉及”\n\n## 输出格式和字段说明\n请使用JavaScript以JSON格式输出优化后的分析结果，包含以下字段：\n\
            \n```json\n{\n  \"hardware_purchase\": \"硬件采购部分内容及其主要参数\",\n  \"software_purchase\"\
            : \"成品软件采购部分及其主要参数\",\n  \"custom_system_development\": \"定制化系统采购部分及其主要参数\"\
            \n}\n```\n\n## 输出示例\n```json\n{\n  \"hardware_purchase\": \"采购了服务器3台（CPU：intel\
            \ x86架构 内存：16G 核心数量：8）、交换机等网络设备5台、安全设备硬件6台\",\n  \"software_purchase\"\
            : \"采购了统信操作系统、达梦数据库成品软件\",\n  \"custom_system_development\": \"定制开发XX综合管理系统，主要实现XX功能\"\
            \n}\n```\n\n请根据上述要求进行全面的采购内容分析和梳理，确保JSON格式正确，可直接解析，且仅输出最终JSON格式结果，不含中间思考过程。除非有充分理由，请不要随意修改和缩减原先输出的内容。"
