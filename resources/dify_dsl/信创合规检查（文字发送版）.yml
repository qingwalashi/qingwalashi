            \n## 输出格式和字段说明\n请使用JavaScript以JSON格式输出优化后的分析结果，包含以下字段：\n\n```json\n{\n\
            \  \"custom_system_development\": {\n    \"is_involved\": \"定制系统开发采购是否涉及（是/否）\"\
            ,\n    \"business\": \"定制系统开发业务\",\n    \"technology_route\": \"定制系统开发技术路线\"\
            ,\n    \"is_compliant\": \"定制系统开发采购是否符合规范（当is_involved为'是'时，返回：是/否/不确定）\"\
            ,\n    \"compliance_notes\": \"定制系统开发(不)合规具体说明\"\n  }\n}\n```\n\n## 输出示例\n\
