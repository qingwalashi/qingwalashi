    - data:
        code: "def main(user_requirement: str, dynamic_rules: dict, service_catalog:\
          \ dict) -> dict:\n    \"\"\"动态生成系统提示词和规则（完全基于远端两份JSON）\"\"\"\n    try:\n\
          \        # 版本信息\n        dr_ver = str(dynamic_rules.get('version', ''))\n\
          \        dr_updated = str(dynamic_rules.get('last_updated', ''))\n     \
          \   sc_ver = str(service_catalog.get('version', ''))\n        sc_updated\
          \ = str(service_catalog.get('last_updated', ''))\n\n        analysis_rules\
          \ = dynamic_rules.get('analysis_rules', {}) or {}\n        service_mapping\
          \ = dynamic_rules.get('service_mapping', {}) or {}\n        analysis_steps\
          \ = dynamic_rules.get('analysis_steps', []) or []\n\n        service_types\
          \ = (service_catalog.get('service_types', {}) or {})\n\n        missing\
          \ = []\n        if not analysis_rules:\n            missing.append('analysis_rules')\n\
          \        if not analysis_steps:\n            missing.append('analysis_steps')\n\
          \        if not service_types:\n            missing.append('service_types')\n\
          \        if missing:\n            msg = f\"配置读取失败，缺少: {', '.join(missing)}\"\
          \n            return {\n                'prompt_data': {\n             \
          \       'system_prompt': msg,\n                    'user_prompt': user_requirement,\n\
          \                    'rules_version': f\"DR:{dr_ver} SC:{sc_ver}\",\n  \
          \                  'error': msg\n                }\n            }\n\n  \
          \      # 规则部分\n        version_line = f\"动态规则库: v{dr_ver}（更新: {dr_updated}），服务目录:\
          \ v{sc_ver}（更新: {sc_updated}）\"\n\n        rules_section = '重要分析规则：'\n \
          \       for key, group in analysis_rules.items():\n            if isinstance(group,\
          \ dict) and 'rules' in group:\n                rules_section += f\"\\n{group.get('description',\
          \ key)}:\"\n                for r in group.get('rules', []):\n         \
          \           rules_section += f\"\\n- {r}\"\n\n        mapping_section =\
          \ ''\n        if isinstance(service_mapping, dict) and service_mapping.get('rules'):\n\
          \            mapping_section = '服务映射与默认/推荐：'\n            for r in service_mapping.get('rules',\
          \ []):\n                mapping_section += f\"\\n- {r}\"\n\n        # 服务类型与规格概览（分类别）\n\
          \        by_category = {'compute': [], 'storage': [], 'network': [], 'security':\
          \ []}\n        for s_key, s in service_types.items():\n            cat =\
          \ s.get('category', 'other')\n            by_category.setdefault(cat, [])\n\
          \            by_category[cat].append((s_key, s))\n\n        def render_specs(s):\n\
          \            parts = []\n            specs = s.get('specs', []) or []\n\
          \            if specs:\n                spec_names = [i.get('spec_name')\
          \ for i in specs if i.get('spec_name')]\n                if spec_names:\n\
          \                    parts.append('规格: ' + ', '.join(spec_names))\n    \
          \        if 'bandwidth_options' in s and isinstance(s.get('bandwidth_options'),\
          \ list):\n                parts.append('带宽可选: ' + ', '.join([str(b)+'M'\
          \ for b in s.get('bandwidth_options')]))\n            if 'default_bandwidth'\
          \ in s:\n                parts.append(f\"默认带宽: {s.get('default_bandwidth')}M\"\
          )\n            if 'default_size' in s:\n                parts.append(f\"\
          默认容量: {s.get('default_size')}GB\")\n            if 'increment' in s:\n \
          \               inc = s.get('increment')\n                if inc:\n    \
          \                parts.append(f\"递增: {inc}\")\n            return '；'.join(parts)\n\
          \n        services_section = '可用服务与规格（按分类）:'\n        for cat in ['compute','storage','network','security']:\n\
          \            items = by_category.get(cat, [])\n            if not items:\n\
          \                continue\n            cat_name = {'compute':'计算','storage':'存储','network':'网络','security':'安全'}.get(cat,\
          \ cat)\n            services_section += f\"\\n{cat_name}:\"\n          \
          \  for s_key, s in items:\n                name = s.get('name', s_key)\n\
          \                desc = s.get('description', '')\n                specs_txt\
          \ = render_specs(s)\n                line = f\"- {s_key}: {name}（{desc}）\"\
          \n                if specs_txt:\n                    line += f\" | {specs_txt}\"\
          \n                services_section += f\"\\n{line}\"\n\n        # 基于目录动态生成返回JSON模板（按分类的数组，服务项使用\
          \ service_type 指定）\n        template = {\n            'success': True,\n\
          \            'application_count': '应用系统数量',\n            'compute_services':\
          \ [],\n            'storage_services': [],\n            'network_services':\
          \ [],\n            'security_services': [],\n            'requirements_summary':\
          \ '需求总结',\n            'total_servers': '服务器总数',\n            'database_servers':\
          \ '数据库服务器数量',\n            'mlps_required': 'level_1 | level_2 | level_3'\n\
          \        }\n\n        # 为每个服务类型提供字段提示：带宽型写 bandwidth，容量型写 size，其他写 spec_name\n\
          \        def service_item_schema(s_key: str, s: dict) -> dict:\n       \
          \     item = {\n                'service_type': s_key,\n               \
          \ 'quantity': '数量',\n                'specifications': {},\n           \
          \     'properties': {},\n                'reason': '选择理由'\n            }\n\
          \            if isinstance(s.get('bandwidth_options'), list):\n        \
          \        item['specifications'] = {'bandwidth': 'Mbps 数值，按可选带宽之一'}\n   \
          \             item['properties'] = {'bandwidth': '同上'}\n            elif\
          \ 'default_size' in s or 'min_size' in s:\n                item['specifications']\
          \ = {'size': 'GB 数值'}\n                item['properties'] = {'size': '同上',\
          \ 'disk_type': s.get('disk_type', 'HDD/SSD')}\n            else:\n     \
          \           # 规格枚举型（如 ECS、license_* 等）\n                item['specifications']\
          \ = {'spec_name': '从规格枚举中选择其一'}\n            return item\n\n        for\
          \ s_key, s in by_category.get('compute', []):\n            template['compute_services'].append(service_item_schema(s_key,\
          \ s))\n        for s_key, s in by_category.get('storage', []):\n       \
          \     template['storage_services'].append(service_item_schema(s_key, s))\n\
          \        for s_key, s in by_category.get('network', []):\n            template['network_services'].append(service_item_schema(s_key,\
          \ s))\n        for s_key, s in by_category.get('security', []):\n      \
          \      template['security_services'].append(service_item_schema(s_key, s))\n\
          \n        import json as _json\n        dynamic_json_template = _json.dumps(template,\
          \ ensure_ascii=False)\n\n        system_prompt = (\n            '你是专业的云服务需求分析师。请根据动态规则与服务目录，严谨识别并规划服务数量与规格，输出严格\
          \ JSON。'\n            + '\\n\\n' + version_line\n            + '\\n\\n'\
          \ + rules_section\n            + ('\\n\\n' + mapping_section if mapping_section\
          \ else '')\n            + '\\n\\n返回 JSON 模板（字段含义按服务目录动态生成，严格对齐服务类别与字段约束）：\\\
          n'\n            + dynamic_json_template\n            + '\\n\\n请确保：1) 服务类型仅使用目录中出现的键；2)\
          \ 规格字段遵循带宽/容量/枚举约束；3) 数量为正整数；4) 解释说明简洁；5) 等保等级mlps_required 仅返回 level_1/level_2/level_3\
          \ 之一（字符串）。'\n            + '\\n\\n注意：1)ECS的规格严格按照定义返回，应是4C8G形式的格式;2)等保一级、等保二级、等保三级要求配置安全产品分别参考mlps_required.level_1,mlps_required.level_2,mlps_required.level_3'\n\
          \        )\n\n        return {\n            'prompt_data': {\n         \
          \       'system_prompt': system_prompt,\n                'user_prompt':\
          \ user_requirement,\n                'rules_version': f\"DR:{dr_ver} SC:{sc_ver}\"\
          \n            }\n        }\n    except Exception as e:\n        return {\n\
          \            'prompt_data': {\n                'system_prompt': '系统提示词生成失败',\n\
          \                'user_prompt': user_requirement,\n                'rules_version':\
          \ 'unknown',\n                'error': str(e)\n            }\n        }"
        code_language: python3
        desc: 智能提示词生成器 - 基于两份远端配置动态构建提示词与JSON模板
        outputs:
          prompt_data:
            children: null
            type: object
        selected: false
        title: 提示词构建器
        type: code
        variables:
