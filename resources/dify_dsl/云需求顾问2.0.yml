    - data:
        code: "import requests\nimport json\nimport time\n\n\ndef fetch_config_with_retry(url:\
          \ str, max_retries: int = 3, retry_delay: float = 1.0) -> dict:\n    \"\"\
          \"从URL获取配置，失败时重试\"\"\"\n    for attempt in range(max_retries):\n       \
          \ try:\n            response = requests.get(url, timeout=5)\n          \
          \  response.raise_for_status()\n            return response.json()\n   \
          \     except (requests.RequestException, json.JSONDecodeError) as e:\n \
          \           if attempt < max_retries - 1:\n                print(f\"配置获取失败，尝试第\
          \ {attempt + 1}/{max_retries} 次重试... 错误: {str(e)}\")\n                time.sleep(retry_delay)\n\
          \                continue\n            raise Exception(f\"无法获取配置，重试 {max_retries}\
          \ 次后失败: {str(e)}\")\n\n\ndef main() -> dict:\n    \"\"\"服务规格读取节点 - 读取各云服务及其规格\"\
          \"\"\n    url = \"https://cloudadvisor.qingwalashi.cn/service_catalog.json\"\
          \n    try:\n        catalog = fetch_config_with_retry(url)\n    except Exception\
          \ as e:\n        print(f\"服务规格加载失败: {str(e)}\")\n        catalog = {}\n\n\
          \    return {\"service_catalog\": catalog}"
        code_language: python3
        desc: 服务清单配置，包含各云服务类型及可选规格
