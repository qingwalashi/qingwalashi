    - data:
        code: "import json\nimport re\n\ndef main(llm_result, user_requirement) ->\
          \ dict:\n    \"\"\"处理AI解析结果：返回 success（一级）、requirements（含 list、total_servers、database_servers、mlps_required）\"\
          \"\"\n    try:\n        # 提取JSON内容，处理markdown代码块格式\n        json_content\
          \ = str(llm_result).strip()\n\n        # 如果包含markdown代码块，提取其中的JSON\n   \
          \     if '```json' in json_content:\n            json_match = re.search(r'```json\\\
          s*\\n(.*?)\\n```', json_content, re.DOTALL | re.IGNORECASE)\n          \
          \  if json_match:\n                json_content = json_match.group(1).strip()\n\
          \        elif '```' in json_content:\n            # 处理普通代码块\n          \
          \  json_match = re.search(r'```\\s*\\n(.*?)\\n```', json_content, re.DOTALL)\n\
          \            if json_match:\n                json_content = json_match.group(1).strip()\n\
          \n        # 标准失败返回（success 提升到一级）\n        def _fail(parse_info_msg: str,\
          \ parsed: dict | None = None) -> dict:\n            parsed = parsed or {}\n\
          \            return {\n                \"parse_info\": parse_info_msg,\n\
          \                \"success\": \"false\",\n                \"requirements\"\
          : {\n                    \"list\": [],\n                    \"total_servers\"\
          : parsed.get(\"total_servers\"),\n                    \"database_servers\"\
          : parsed.get(\"database_servers\"),\n                    \"mlps_required\"\
          : parsed.get(\"mlps_required\")\n                }\n            }\n\n  \
          \      # 尝试解析JSON\n        if not json_content.startswith('{'):\n      \
          \      try:\n                parsed_data = json.loads(str(llm_result).strip())\n\
          \            except Exception:\n                return _fail(\"AI解析失败：无法识别有效的服务配置\"\
          )\n        else:\n            parsed_data = json.loads(json_content)\n\n\
          \        # 若无 success 或 success 为 False，直接失败返回（与原程序语义一致）\n        if not\
          \ parsed_data.get('success', False):\n            return _fail(\"AI解析失败：无法识别有效的服务配置\"\
          , parsed_data)\n\n        summary = parsed_data.get('requirements_summary',\
          \ '需求已解析')\n        requirements = []\n\n        # 处理计算服务\n        compute_services\
          \ = parsed_data.get('compute_services', [])\n        for service_data in\
          \ compute_services:\n            service_type = service_data.get('service_type')\n\
          \            if service_type:\n                quantity = service_data.get('quantity',\
          \ 1)\n                specifications = service_data.get('specifications',\
          \ {}) or {}\n                properties = service_data.get('properties',\
          \ {}) or {}\n                requirements.append({\n                   \
          \ 'service': service_type,\n                    'spec': specifications.get('spec_name'),\n\
          \                    'quantity': quantity,\n                    'properties':\
          \ properties,\n                    'category': 'compute'\n             \
          \   })\n\n        # 处理存储服务\n        storage_services = parsed_data.get('storage_services',\
          \ [])\n        for service_data in storage_services:\n            service_type\
          \ = service_data.get('service_type')\n            if service_type:\n   \
          \             quantity = service_data.get('quantity', 1)\n             \
          \   specifications = service_data.get('specifications', {}) or {}\n    \
          \            properties = service_data.get('properties', {}) or {}\n   \
          \             requirements.append({\n                    'service': service_type,\n\
          \                    'spec': specifications.get('size', specifications.get('spec_name')),\n\
          \                    'quantity': quantity,\n                    'properties':\
          \ properties,\n                    'category': 'storage'\n             \
          \   })\n\n        # 处理网络服务\n        network_services = parsed_data.get('network_services',\
          \ [])\n        for service_data in network_services:\n            service_type\
          \ = service_data.get('service_type')\n            if service_type:\n   \
          \             quantity = service_data.get('quantity', 1)\n             \
          \   specifications = service_data.get('specifications', {}) or {}\n    \
          \            properties = service_data.get('properties', {}) or {}\n   \
          \             requirements.append({\n                    'service': service_type,\n\
          \                    'spec': specifications.get('bandwidth', specifications.get('spec_name')),\n\
          \                    'quantity': quantity,\n                    'properties':\
          \ properties,\n                    'category': 'network'\n             \
          \   })\n\n        # 处理安全服务\n        security_services = parsed_data.get('security_services',\
          \ [])\n        for service_data in security_services:\n            service_type\
