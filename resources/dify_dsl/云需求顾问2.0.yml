          \                continue\n            raise Exception(f\"无法获取配置，重试 {max_retries}\
          \ 次后失败: {str(e)}\")\n\n\ndef main() -> dict:\n    \"\"\"动态规则读取节点 - 读取分析规则、服务映射与分析步骤\"\
          \"\"\n    config_url = \"https://cloudadvisor.qingwalashi.cn/dynamic_rules.json\"\
          \n    try:\n        dynamic_rules = fetch_config_with_retry(config_url)\n\
          \    except Exception as e:\n        print(f\"动态规则加载失败: {str(e)}\")\n  \
          \      dynamic_rules = {}\n\n    return {\"dynamic_rules\": dynamic_rules}"
        code_language: python3
        desc: json格式动态规则，包含分析规则、服务映射、分析步骤等
