<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Markdown转Word文档工具</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow">
                <div class="border-b">
                    <ul class="flex">
                        <li class="flex-1">
                            <a class="block py-3 px-4 text-center border-b-2 border-blue-500 text-blue-600" id="paste-tab" href="#paste-content">粘贴文本</a>
                        </li>
                        <li class="flex-1">
                            <a class="block py-3 px-4 text-center text-gray-500 hover:text-gray-700" id="upload-tab" href="#upload-content">上传文件</a>
                        </li>
                    </ul>
                </div>
                <div class="p-4">
                    <div class="tab-content">
                        <div class="tab-pane active" id="paste-content">
                            <textarea id="markdown-input" class="w-full h-64 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="在此粘贴Markdown文本..."></textarea>
                        </div>
                        <div class="tab-pane hidden" id="upload-content">
                            <div class="upload-area border-2 border-dashed rounded-lg p-8 text-center" id="upload-area">
                                <input type="file" id="file-input" accept=".md,.markdown,.txt" class="hidden">
                                <i class="bi bi-cloud-upload text-4xl text-gray-400"></i>
                                <p class="mt-3 text-gray-600">点击或拖拽文件到此处上传</p>
                                <button class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600" onclick="document.getElementById('file-input').click()">选择文件</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow">
                <div class="border-b p-4">
                    <h5 class="text-lg font-medium">模板设置</h5>
                </div>
                <div class="p-4">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择预设模板</label>
                        <select class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="template-select">
                            <option value="default">默认模板</option>
                            <option value="official">公文模板</option>
                            <option value="finance">金融行业模板</option>
                            <option value="custom">自定义模板</option>
                        </select>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="template-settings space-y-4">
                            <!-- 正文字体设置 -->
                            <div class="border rounded-lg">
                                <button class="w-full p-3 text-left font-medium flex justify-between items-center" onclick="toggleSection('text-settings')">
                                    <span>正文字体设置</span>
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                                <div id="text-settings" class="p-4 space-y-4 hidden">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">正文字体</label>
                                        <select class="w-full p-2 border rounded-lg" id="font-family">
                                            <option value="SimSun">宋体</option>
                                            <option value="SimHei">黑体</option>
                                            <option value="Microsoft YaHei">微软雅黑</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">正文字号</label>
                                        <select class="w-full p-2 border rounded-lg" id="font-size">
                                            <option value="16">三号</option>
                                            <option value="14">四号</option>
                                            <option value="12">小四</option>
                                            <option value="10.5">五号</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">行距</label>
                                        <select class="w-full p-2 border rounded-lg" id="line-spacing">
                                            <option value="1.5">1.5倍行距</option>
                                            <option value="2">2倍行距</option>
                                            <option value="2.5">2.5倍行距</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 标题字体设置 -->
                            <div class="border rounded-lg">
                                <button class="w-full p-3 text-left font-medium flex justify-between items-center" onclick="toggleSection('heading-settings')">
                                    <span>标题字体设置</span>
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                                <div id="heading-settings" class="p-4 space-y-4 hidden">
                                    <!-- 一级标题 -->
                                    <div class="space-y-2">
                                        <label class="block text-sm font-medium text-gray-700">一级标题</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            <select class="p-2 border rounded-lg" id="h1-font-family">
                                                <option value="SimSun">宋体</option>
                                                <option value="SimHei">黑体</option>
                                                <option value="Microsoft YaHei">微软雅黑</option>
                                            </select>
                                            <select class="p-2 border rounded-lg" id="h1-font-size">
                                                <option value="22">小二号</option>
                                                <option value="20">三号</option>
                                                <option value="18">四号</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 二级标题 -->
                                    <div class="space-y-2">
                                        <label class="block text-sm font-medium text-gray-700">二级标题</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            <select class="p-2 border rounded-lg" id="h2-font-family">
                                                <option value="SimSun">宋体</option>
                                                <option value="SimHei">黑体</option>
                                                <option value="Microsoft YaHei">微软雅黑</option>

// 将对象转换为YAML字符串
function objectToYaml(obj) {
    return jsyaml.dump(obj, {
        indent: 2,
        lineWidth: -1,
        noRefs: true
    });
}

// 将YAML字符串转换为对象
function yamlToObject(yaml) {
    try {
        return jsyaml.load(yaml);
    } catch (e) {
        console.error('YAML解析错误:', e);
        return null;
    }
}

// 更新配置文本框
function updateConfigTextarea(template) {
    const configTextarea = document.getElementById('template-config');
    configTextarea.value = objectToYaml(template);
}

// 更新表单值
function updateFormValues(template) {
    document.getElementById('font-family').value = template.fontFamily;
    document.getElementById('font-size').value = template.fontSize;
    document.getElementById('line-spacing').value = template.lineSpacing;
    document.getElementById('h1-font-family').value = template.h1FontFamily;
    document.getElementById('h1-font-size').value = template.h1FontSize;
    document.getElementById('h2-font-family').value = template.h2FontFamily;
    document.getElementById('h2-font-size').value = template.h2FontSize;
    document.getElementById('h3-font-family').value = template.h3FontFamily;
    document.getElementById('h3-font-size').value = template.h3FontSize;
    document.getElementById('h4-font-family').value = template.h4FontFamily;
    document.getElementById('h4-font-size').value = template.h4FontSize;
    document.getElementById('margin-top').value = template.margins.top;
    document.getElementById('margin-right').value = template.margins.right;
    document.getElementById('margin-bottom').value = template.margins.bottom;
    document.getElementById('margin-left').value = template.margins.left;
    
    // 更新表格配置
    document.getElementById('table-font-family').value = template.table.fontFamily;

// 初始化页面
document.addEventListener('DOMContentLoaded', function() {
    // 文件上传区域拖放功能
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');

    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleFile(files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // 模板选择事件
    const templateSelect = document.getElementById('template-select');
    templateSelect.addEventListener('change', (e) => {
        const selectedTemplate = e.target.value;
        const template = templates[selectedTemplate];
        updateFormValues(template);
        updateConfigTextarea(template);
    });

    // 表单值变化时更新YAML配置
    const formInputs = document.querySelectorAll('.template-settings select, .template-settings input');
    formInputs.forEach(input => {
        input.addEventListener('change', () => {
            const newConfig = getConfigFromForm();
            updateConfigTextarea(newConfig);
        });
    });

    // YAML配置变化时更新表单
    const configTextarea = document.getElementById('template-config');
    configTextarea.addEventListener('change', () => {
        const newConfig = yamlToObject(configTextarea.value);
        if (newConfig) {
            updateFormValues(newConfig);
        }
    });

    // 转换按钮事件
    document.getElementById('convert-btn').addEventListener('click', convertToWord);

    // 初始化显示默认模板的配置
    updateFormValues(templates.default);
    updateConfigTextarea(templates.default);
});

// 处理上传的文件
function handleFile(file) {
    if (file.type === 'text/markdown' || file.type === 'text/plain' || file.name.endsWith('.md')) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('markdown-input').value = e.target.result;
            document.getElementById('paste-tab').click();
        };
        reader.readAsText(file);
    } else {
        alert('请上传Markdown文件！');
    }
}

// 将HTML转换为docx格式
function convertHtmlToDocx(element, template) {
    const children = [];
    
    for (const node of element.childNodes) {
        if (node.nodeType === Node.TEXT_NODE) {
            if (node.textContent.trim()) {
                children.push(new docx.Paragraph({
                    children: [new docx.TextRun({
                        text: node.textContent,
                        font: template.fontFamily,
                        size: template.fontSize * 2
                    })],
                    spacing: {
                        line: template.lineSpacing * 240
                    }
                }));
            }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
            switch (node.tagName.toLowerCase()) {
                case 'h1':
                    children.push(new docx.Paragraph({
                        children: [new docx.TextRun({
                            text: node.textContent,
                            font: template.h1FontFamily,
                            size: template.h1FontSize * 2,
                            bold: true
                        })],
                        spacing: {
                            before: 240,
                            after: 240
                        },
                        outlineLevel: 0,  // 一级标题
                        style: {
                            id: "Heading1",
                            name: "Heading 1"
                        }
                    }));
                    break;
                case 'h2':
                    children.push(new docx.Paragraph({
                        children: [new docx.TextRun({
                            text: node.textContent,
                            font: template.h2FontFamily,
                            size: template.h2FontSize * 2,
                            bold: true
                        })],
                        spacing: {
                            before: 240,
                            after: 240
                        },
                        outlineLevel: 1,  // 二级标题
                        style: {
                            id: "Heading2",
                            name: "Heading 2"
                        }
                    }));
                    break;
                case 'h3':
                    children.push(new docx.Paragraph({
                        children: [new docx.TextRun({
                            text: node.textContent,
                            font: template.h3FontFamily,
                            size: template.h3FontSize * 2,
                            bold: true
                        })],
                        spacing: {
                            before: 240,
                            after: 240
                        },
                        outlineLevel: 2,  // 三级标题
                        style: {
                            id: "Heading3",
                            name: "Heading 3"
                        }
                    }));
                    break;
                case 'h4':
                    children.push(new docx.Paragraph({
                        children: [new docx.TextRun({
                            text: node.textContent,
                            font: template.h4FontFamily,
                            size: template.h4FontSize * 2,
                            bold: true
                        })],
                        spacing: {
                            before: 240,
                            after: 240
                        },
                        outlineLevel: 3,  // 四级标题
                        style: {
                            id: "Heading4",
                            name: "Heading 4"
                        }
                    }));
                    break;
                case 'p':
                    children.push(new docx.Paragraph({
                        children: [new docx.TextRun({
                            text: node.textContent,
                            font: template.fontFamily,
                            size: template.fontSize * 2
                        })],
                        spacing: {
                            line: template.lineSpacing * 240
                        },
                        style: {
                            id: "Normal",
                            name: "Normal"
                        }
                    }));
                    break;
                case 'ul':
                case 'ol':
                    node.querySelectorAll('li').forEach(li => {
                        children.push(new docx.Paragraph({
                            children: [new docx.TextRun({
                                text: '• ' + li.textContent,
                                font: template.fontFamily,
                                size: template.fontSize * 2
                            })],
                            spacing: {
                                line: template.lineSpacing * 240
                            },
                            style: {
                                id: "ListParagraph",
                                name: "List Paragraph"
                            }
                        }));
                    });
                    break;
                case 'table':
                    const tableRows = [];
                    const tableCells = Array.from(node.querySelectorAll('tr')).map(tr => {
                        return Array.from(tr.querySelectorAll('td, th')).map(cell => {
                            return new docx.TableCell({
                                children: [new docx.Paragraph({
                                    children: [new docx.TextRun({
                                        text: cell.textContent,
                                        font: template.table.fontFamily,
                                        size: template.table.fontSize * 2
                                    })],
                                    alignment: template.table.alignment,
                                    spacing: {
                                        line: template.table.lineSpacing * 240
                                    }
                                })],
                                borders: {
                                    top: { style: 'single', size: 1, color: '000000' },
                                    bottom: { style: 'single', size: 1, color: '000000' },
                                    left: { style: 'single', size: 1, color: '000000' },
                                    right: { style: 'single', size: 1, color: '000000' },
                                    insideHorizontal: { style: 'single', size: 1, color: '000000' },
                                    insideVertical: { style: 'single', size: 1, color: '000000' }
                                }
                            });
                        });
                    });

                    children.push(new docx.Table({
                        rows: tableCells.map(cells => new docx.TableRow({
                            children: cells
                        })),
                        width: {
                            size: 100,
                            type: docx.WidthType.PERCENTAGE
                        },
                        alignment: docx.AlignmentType.CENTER
                    }));
                    break;
                default:
                    if (node.textContent.trim()) {
                        children.push(new docx.Paragraph({
                            children: [new docx.TextRun({
                                text: node.textContent,
                                font: template.fontFamily,
                                size: template.fontSize * 2
                            })],
                            spacing: {
                                line: template.lineSpacing * 240
                            },
                            style: {
                                id: "Normal",
                                name: "Normal"
                            }
                        }));
                    }
            }
        }
    }
    
    return children;
}

// 将Markdown转换为Word文档
async function convertToWord() {
    const markdownText = document.getElementById('markdown-input').value;
    if (!markdownText.trim()) {
        alert('请输入或上传Markdown文本！');
        return;
    }

    // 获取当前配置
    const templateType = document.getElementById('template-select').value;
    let template;
    
    if (templateType === 'custom') {
        template = getConfigFromForm();
    } else {
        // 尝试从配置文本框获取最新配置
        const configTextarea = document.getElementById('template-config');
        const newConfig = yamlToObject(configTextarea.value);
        template = newConfig || templates[templateType];
    }

    // 将毫米转换为twips (1mm = 56.7twips)
    const margins = {
        top: Math.round(template.margins.top * 56.7),
        right: Math.round(template.margins.right * 56.7),
        bottom: Math.round(template.margins.bottom * 56.7),
        left: Math.round(template.margins.left * 56.7)
    };

    // 解析Markdown
    const htmlContent = marked.parse(markdownText);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlContent;

    // 创建Word文档
    const doc = new docx.Document({
        styles: {
            paragraphStyles: [
                {
                    id: "Heading1",
                    name: "Heading 1",
                    basedOn: "Normal",
                    next: "Normal",
                    quickFormat: true,
                    run: {
                        size: template.h1FontSize * 2,
                        bold: true,
                        font: template.h1FontFamily
                    }
                },
                {
                    id: "Heading2",
                    name: "Heading 2",
                    basedOn: "Normal",
                    next: "Normal",
                    quickFormat: true,
                    run: {
                        size: template.h2FontSize * 2,
                        bold: true,
                        font: template.h2FontFamily
                    }
                },
                {
                    id: "Heading3",
                    name: "Heading 3",
                    basedOn: "Normal",
                    next: "Normal",
                    quickFormat: true,
                    run: {
                        size: template.h3FontSize * 2,
                        bold: true,
                        font: template.h3FontFamily
                    }
                },
                {
                    id: "Heading4",
                    name: "Heading 4",
                    basedOn: "Normal",
                    next: "Normal",
                    quickFormat: true,
                    run: {
                        size: template.h4FontSize * 2,
                        bold: true,
                        font: template.h4FontFamily
                    }
                },
                {
                    id: "Normal",
                    name: "Normal",
                    run: {
                        size: template.fontSize * 2,
                        font: template.fontFamily
                    }
                },
                {
                    id: "ListParagraph",
                    name: "List Paragraph",
                    basedOn: "Normal",
                    run: {
                        size: template.fontSize * 2,
                        font: template.fontFamily
                    }
                }
            ]
        },
        sections: [{
            properties: {
                page: {
                    margin: margins
                }
            },
            children: convertHtmlToDocx(tempDiv, template)
        }]
    });

    // 生成并下载文档
    const blob = await docx.Packer.toBlob(doc);
    saveAs(blob, 'converted-document.docx');
} </script>
